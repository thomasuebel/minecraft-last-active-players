display:
  # Number of last-active players listed on join and via /lastactive.
  list-size: 3
  # Date format for {date} token. Uses Java DateTimeFormatter patterns.
  date-format: "yyyy-MM-dd"
  # Delay in seconds before the join message is sent to the joining player (0 = next tick).
  join-delay-seconds: 10

messages:
  # Template for each player entry in the last-active list.
  # Tokens: {n}, {player}, {date}, {duration}
  # {duration} reflects the player's playtime in the rolling 30-day window.
  # {date} shows "today", "yesterday", or "N days ago" for the last 6 days,
  # then falls back to display.date-format for older dates.
  join-entry: "Last Active: {n}. {player} was last seen {date} ({duration} last 30 days)"
  # Relative date labels for {date}. Localise these to any language.
  date-today: "today"
  date-yesterday: "yesterday"
  # Token: {days}
  date-days-ago: "{days} days ago"
  # MVP broadcast message. Token: {player}
  # Tip: add an emoji prefix, e.g. "[Crown] Most active player (last 30 days): {player}"
  mvp: "[Crown] Most active player (last 30 days): {player}"
  # MVP tie broadcast message. Token: {players} (comma-separated list)
  mvp-tie: "[Crown] {players} are tied for MVP (last 30 days)!"
  # Streak broadcast message. Tokens: {player}, {streak}
  streak: "[Fire] Longest daily login streak: {player} ({streak} days)"
  # Streak tie broadcast message. Tokens: {players} (comma-separated list), {streak}
  streak-tie: "[Fire] {players} are tied for longest daily login streak ({streak} days)!"
  # Private rank hint sent to the joining player based on 30-day playtime ranking.
  # Tokens: {rank}, {minutes}, {next_rank}
  rank-hint: "You are rank #{rank}. {minutes} more minutes to reach #{next_rank}."
  # Milestone streak broadcast. Tokens: {player}, {streak}
  streak-milestone: "[Fire] {player} has reached a {streak}-day login streak!"
  # Full-screen title shown to the achieving player on a streak milestone. Tokens: {player}, {streak}
  # Set to "" to disable.
  streak-milestone-title: "{streak}-Day Streak!"
  # Subtitle shown below the milestone title. Tokens: {player}, {streak}. Set to "" to disable.
  streak-milestone-subtitle: "A new milestone reached!"
  # Private message sent to a player when a streak shield is consumed. Tokens: {streak}, {shields_remaining}
  streak-shield-used: "[Shield] Streak protected! ({streak} days) Shields remaining: {shields_remaining}"
  # Private message sent to a player when streak shields are awarded at a milestone. Token: {shields} (total after award).
  # Set to "" to disable.
  streak-shield-earned: "[Shield] You earned a streak shield! Total shields: {shields}"

prefix:
  # Display name prefix applied to the current MVP. Tip: use "👑 " for a crown emoji.
  mvp: "[Crown] "
  # Display name prefix applied to the current streak leader. Tip: use "🔥 " for a fire emoji.
  streak: "[Fire] "

streak:
  # Maximum number of streak shields a player can hold at once.
  # Shields are awarded when a new milestone (3, 7, 14, 30, or 60 days) is reached.
  # A shield bridges exactly one missed calendar day without breaking the streak.
  max-shields: 3

session:
  # How often (in minutes) active session time is flushed to the database.
  heartbeat-interval-minutes: 10

awards:
  # Extra permission nodes granted alongside award permissions.
  # Useful for granting kit permissions (e.g. essentials.kits.mvp-daily)
  # so that EssentialsX enforces its per-kit cooldown when players claim
  # rewards via a menu plugin.
  mvp:
    extra-permissions: []
  streak:
    3:
      extra-permissions: []
    7:
      extra-permissions: []
    14:
      extra-permissions: []
    30:
      extra-permissions: []
    60:
      extra-permissions: []

data:
  # Players inactive for this many days will have their data purged on startup.
  purge-inactive-days: 60
