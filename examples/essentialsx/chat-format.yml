# LastActivePlayers - EssentialsXChat format with award prefix
#
# Requirements:
#   - PlaceholderAPI installed and running
#   - LastActivePlayers 1.0.7+ (registers %lastactiveplayers_prefix% on startup)
#
# Apply this snippet by editing plugins/Essentials/config.yml.
# Find the existing `chat:` section (or `format:` key) and replace the format line.
# Then run /ess reload or restart the server.
#
# How it works:
#   %lastactiveplayers_prefix% resolves to the configured award prefix for the player:
#     - "[Crown] "  if the player is the current MVP
#     - "[Fire] "   if the player is the current streak leader
#     - ""          (empty) for all other players
#
#   Because the value is empty for non-award-holders, non-award chat lines look exactly
#   as they did before -- no extra space or bracket is inserted.
#
# Colour codes:
#   If you add colour codes to prefix.mvp or prefix.streak in LastActivePlayers config.yml
#   (e.g. "&6[Crown]&r "), include a reset code (&r) after %lastactiveplayers_prefix%
#   in the format below so the colour does not bleed into the player name or message.
#   The default ASCII prefixes ("[Crown] ", "[Fire] ") contain no colour codes, so no
#   reset is needed out of the box.

chat:
  # Minimal format: award prefix followed by the EssentialsX display name.
  format: '<%lastactiveplayers_prefix%{DISPLAYNAME}> {MESSAGE}'

  # --- Optional extended examples ---

  # With colour reset after the prefix (safe when prefix.mvp/streak use colour codes):
  # format: '<%lastactiveplayers_prefix%&r{DISPLAYNAME}&r> {MESSAGE}'

  # With LuckPerms prefix before the display name (requires LuckPerms and its PAPI extension):
  # format: '%luckperms_prefix%%lastactiveplayers_prefix%{DISPLAYNAME}&r: {MESSAGE}'

  # With world name:
  # format: '[{WORLD}] %lastactiveplayers_prefix%{DISPLAYNAME}: {MESSAGE}'
